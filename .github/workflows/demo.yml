name: demo
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          github_user_name: ${{ github.repository_owner }}
          # README の見本に使う。盤面4種類 × ライト・ダーク
          outputs: |
            out/contributions-drop.svg
            out/contributions-drop-dark.svg?palette=github-dark
            out/contributions-drop-18x7.svg?board=18x7
            out/contributions-drop-18x7-dark.svg?board=18x7&palette=github-dark
            out/contributions-drop-14x7.svg?board=14x7
            out/contributions-drop-14x7-dark.svg?board=14x7&palette=github-dark
            out/contributions-drop-graph.svg?board=graph
            out/contributions-drop-graph-dark.svg?board=graph&palette=github-dark
      - name: push to output branch
        run: |
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "update demo"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
